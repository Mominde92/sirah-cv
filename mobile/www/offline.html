<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sirah</title>
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #ffffff; color: #121722; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px; text-align: center; box-sizing: border-box; }
    .mark { width: 72px; height: 72px; border-radius: 20px; background: #3a48e3; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 20px; margin: 8px 0 0; }
    p { margin: 0; color: #667085; font-size: 15px; line-height: 1.6; max-width: 320px; }
    button { margin-top: 12px; border: 0; border-radius: 12px; background: #3a48e3; color: #fff; font-size: 15px; font-weight: 600; padding: 12px 22px; }
</style>
</head>
<body>
<main>
    <div class="mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 32 32"><path d="M10 9.5h8.5L22 13v9.5a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1Z" fill="#fff"/><path d="M12 15.5h7M12 18.5h7M12 21h4" stroke="#3a48e3" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <h1>No connection · لا يوجد اتصال</h1>
    <p>Check your internet connection and try again.<br>تحقق من اتصالك بالإنترنت ثم حاول مرة أخرى.</p>
    <button type="button" onclick="location.href = window.location.origin">Try again · إعادة المحاولة</button>
</main>
</body>
</html>
